# Secret scan (2026-10-11). This repo is public: a leaked key is visible to everyone
# the moment it is pushed, so every match fails, verified or not. Verified-only is blind
# for most keys: it found 0 of 3 synthetic GitHub, Stripe and DeepSeek keys, all three
# as "unverified". The full history was clean when this was added (0 matches).
# A false positive: put the value behind `# trufflehog:ignore` on its line.
name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel only superseded PR runs. On main every push scans just its own before..after
# range, so a cancelled push run would leave that range unscanned for good.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # PR: the PR's own commits. Push: the pushed range; a new branch (before = 0…0)
      # or a manual run scans the whole history.
      - name: Determine scan range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "base=$PR_BASE" >> "$GITHUB_OUTPUT"; echo "head=$PR_HEAD" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "base=$BEFORE" >> "$GITHUB_OUTPUT"; echo "head=$AFTER" >> "$GITHUB_OUTPUT"
          else
            echo "base=" >> "$GITHUB_OUTPUT"; echo "head=$AFTER" >> "$GITHUB_OUTPUT"
          fi

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3.99.3
        with:
          path: ./
          base: ${{ steps.range.outputs.base }}
          head: ${{ steps.range.outputs.head }}
          extra_args: --results=verified,unknown,unverified
